name: Build Cline 4.0.12 Prompt Patch
on:
  workflow_dispatch:
  push:
    branches:
      - work/v4.0.12-prompt-patch-clean
concurrency:
  group: cline-v4.0.12-prompt-patch-${{ github.ref }}
  cancel-in-progress: true

env:
  PATCH_VERSION: 4.0.12-prompt-patch.5
jobs:
  build-vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode/package-lock.json
      - name: Install extension dependencies
        working-directory: apps/vscode
        run: npm install
      - name: Install webview dependencies
        working-directory: apps/vscode/webview-ui
        run: npm ci --ignore-scripts
      - name: Check types and lint
        working-directory: apps/vscode
        run: npm run check-types && npm run lint
      - name: Run webview tests
        working-directory: apps/vscode
        run: npm run test:webview
      - name: Build VSIX
        working-directory: apps/vscode
        run: npx vsce package --allow-package-secrets sendgrid --out "cline-${PATCH_VERSION}.vsix"
      - name: Validate package and checksum
        working-directory: apps/vscode
        run: |
          VSIX_NAME="cline-${PATCH_VERSION}.vsix"
          unzip -t "$VSIX_NAME"
          unzip -p "$VSIX_NAME" extension/package.json | PATCH_VERSION="$PATCH_VERSION" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); if(p.version !== process.env.PATCH_VERSION) process.exit(1); console.log(JSON.stringify({name:p.name,version:p.version,engines:p.engines}))})'
          sha256sum "$VSIX_NAME" > "$VSIX_NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cline-${{ env.PATCH_VERSION }}
          path: |
            apps/vscode/cline-${{ env.PATCH_VERSION }}.vsix
            apps/vscode/cline-${{ env.PATCH_VERSION }}.vsix.sha256
